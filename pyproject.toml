[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archbench-cuda"
version = "0.2.0"
description = "Capability-aware CUDA architecture benchmark source suite"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = []

[project.scripts]
archbench = "archbench.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
